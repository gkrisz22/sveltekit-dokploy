user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Connection header sent upstream: "upgrade" for WebSockets, "" otherwise.
    # Empty (not "close") is what lets the upstream `keepalive` pool be reused.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # X-Forwarded-Proto passthrough from Traefik, with a sane default when
    # the request arrives directly (docker healthcheck, local `docker run`).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Proxy cache for immutable assets (_app/immutable)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=24h max_size=100m use_temp_path=off;

    upstream sveltekit {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security headers (Dokploy/Traefik handles TLS, but we still set safe defaults)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health check — fast path, no proxy buffering needed
        # Let nginx handle /health if you want, but we proxy to SvelteKit for consistency
        # SvelteKit's /api/health is the canonical health endpoint

        # Proxy all to SvelteKit
        location / {
            proxy_pass http://sveltekit;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Preserve original proto from Traefik (https) or direct (http)
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support (SvelteKit doesn't need it in prod, but harmless)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 16k;

            # Don't cache by default — SvelteKit sets cache headers
            proxy_cache_bypass $http_upgrade;
        }

        # Cache immutable assets aggressively (SvelteKit hashes filenames)
        location ~* ^/_app/immutable/ {
            proxy_pass http://sveltekit;
            proxy_cache STATIC;
            proxy_cache_valid 200 1y;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            # Still need headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # add_header does not inherit from the server block once this
            # level declares any, so repeat the security headers here.
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # No `expires` / `add_header Cache-Control` here: SvelteKit already
            # sends `public,max-age=31536000,immutable` for hashed assets, and
            # add_header appends to the upstream header rather than replacing it.
            access_log off;
        }

        # Optional: serve robots directly if needed, otherwise proxy
        # location = /robots.txt { proxy_pass http://sveltekit; }

        # Deny hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

}
