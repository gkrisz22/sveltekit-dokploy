name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

# A PR branch fires both events, which used to run `check` twice. `head_ref` is
# the source branch on pull_request and `ref_name` is the branch on push, so
# both events for the same branch land in one group and the newer run cancels
# the older instead of duplicating it.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
